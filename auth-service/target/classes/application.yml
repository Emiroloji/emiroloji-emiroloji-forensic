server:
  port: 8081

spring:
  application:
    name: auth-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forensic_db}
    username: ${SPRING_DATASOURCE_USERNAME:forensic_user}
    password: ${SPRING_DATASOURCE_PASSWORD:forensic_secure_password_2024}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
        '[default_schema]': auth
        jdbc:
          '[time_zone]': UTC
    open-in-view: false
    
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:forensic_jwt_secret_key_2024_very_long_and_secure_change_this_to_256_bit_key}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# Security Configuration
security:
  password:
    min-length: 12
    require-uppercase: true
    require-lowercase: true
    require-digits: true
    require-special-chars: true
  session:
    max-sessions-per-user: 5
    session-timeout: 86400 # 24 hours in seconds
  login:
    max-attempts: 5
    lockout-duration: 1800 # 30 minutes in seconds

# 2FA Configuration
two-factor:
  enabled: true
  issuer: "Forensic Face Match System"
  window-size: 1

# Audit Configuration
audit:
  enabled: true
  log-failed-attempts: true
  log-successful-logins: true
  log-password-changes: true
  log-role-changes: true

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,auditevents
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    com.forensic.auth: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  file:
    name: logs/auth-service.log
    max-size: 100MB
    max-history: 30

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.forensic.auth: DEBUG
    org.springframework.security: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.forensic.auth: INFO
    org.springframework.security: WARN
    root: WARN

# Production security settings
security:
  session:
    max-sessions-per-user: 3
    session-timeout: 28800 # 8 hours in seconds

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: jdbc:postgresql://postgres:5432/forensic_db
    username: forensic_user
    password: ${POSTGRES_PASSWORD:forensic_secure_password_2024}
  
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:forensic_redis_secure_2024}

jwt:
  secret: ${JWT_SECRET:forensic_jwt_secret_key_2024_very_long_and_secure_change_this_to_256_bit_key}
  expiration: ${JWT_EXPIRATION:86400000}
