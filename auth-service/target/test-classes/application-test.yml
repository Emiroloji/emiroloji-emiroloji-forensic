server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-testing-purposes-only
  expirationMs: 3600000
  refreshExpirationMs: 604800000

logging:
  level:
    com.forensic.auth: DEBUG
    org.springframework.security: DEBUG
