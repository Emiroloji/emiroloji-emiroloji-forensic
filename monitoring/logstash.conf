input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][service] == "gateway-service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:message}" }
    }
  }
  
  if [fields][service] == "auth-service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:message}" }
    }
  }
  
  if [fields][service] == "case-service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:message}" }
    }
  }
  
  if [fields][service] == "storage-service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:message}" }
    }
  }
  
  if [fields][service] == "audit-service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:message}" }
    }
  }
  
  if [fields][service] == "ai-service" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:message}" }
    }
  }

  # Parse HTTP access logs
  if [fields][log_type] == "access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
  }

  # Parse error logs
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }

  # Parse security events
  if [message] =~ /(?i)(unauthorized|forbidden|security|attack|injection)/ {
    mutate {
      add_tag => [ "security" ]
    }
  }

  # Parse face analysis events
  if [message] =~ /(?i)(face|comparison|detection|analysis)/ {
    mutate {
      add_tag => [ "face_analysis" ]
    }
  }

  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "forensic-logs-%{+YYYY.MM.dd}"
  }
  
  # Send security events to a separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "forensic-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Send face analysis events to a separate index
  if "face_analysis" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "forensic-face-analysis-%{+YYYY.MM.dd}"
    }
  }
}
