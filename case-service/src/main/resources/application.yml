server:
  port: 8083

spring:
  application:
    name: Case Service
  datasource:
    url: jdbc:postgresql://postgres:5432/forensic_db
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://gateway-service:8080/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    com.forensic: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"