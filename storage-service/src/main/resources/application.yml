server:
  port: 8083

spring:
  application:
    name: storage-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/forensic_storage}
    username: ${POSTGRES_USER:forensic_user}
    password: ${POSTGRES_PASSWORD:ForensicSecure2024!}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:forensic-files}

# Encryption Configuration
encryption:
  master-key: ${ENCRYPTION_KEY:forensic_encryption_key_32_chars_2024}
  algorithm: AES-256-GCM
  key-rotation-days: 90

# File Upload Configuration
file:
  upload:
    max-size: ${MAX_FILE_SIZE:104857600} # 100MB
    max-image-size: ${MAX_IMAGE_SIZE:52428800} # 50MB
    max-video-size: ${MAX_VIDEO_SIZE:1073741824} # 1GB
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/bmp
      - image/tiff
      - video/mp4
      - video/avi
      - video/mov
      - video/wmv
      - application/pdf
      - text/plain

# Virus Scanning Configuration
virus-scan:
  enabled: ${VIRUS_SCAN_ENABLED:true}
  engine: ${VIRUS_SCAN_ENGINE:clamav}
  timeout: ${VIRUS_SCAN_TIMEOUT:30000} # 30 seconds

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    com.forensic.storage: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  file:
    name: logs/storage-service.log
    max-size: 100MB
    max-history: 30

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.forensic.storage: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.forensic.storage: INFO
    org.springframework.security: WARN
    root: WARN

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: jdbc:postgresql://postgres:5432/forensic_db
    username: forensic_user
    password: ${POSTGRES_PASSWORD:forensic_secure_password_2024}

minio:
  endpoint: http://minio:9000
  access-key: forensic_admin
  secret-key: ${MINIO_PASSWORD:forensic_minio_secure_2024}
